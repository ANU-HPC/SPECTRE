spack:
  definitions:
    - core-packages:
      - cmake
      - lmod
    - packages:
      - hdf5+hl+fortran+mpi
      - openmpi
      - openblas
      - fftw
      - python@3.11
      - py-numpy
      - py-mpi4py

    - compilers:
      - gcc@13.2.0

  specs:
    - matrix:
      - [$compilers]
    - matrix:
      - [$core-packages]
      - ['%gcc@13.2.0']
    - matrix:
      - [$packages]
      - [$%compilers]

  concretizer:
    unify: false

  config:
    install_tree: /opt/software

  view: False
