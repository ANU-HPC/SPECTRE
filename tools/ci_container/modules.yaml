modules:
  # Make sure that the modules have the `LD_LIBRARY_PATH` set correctly
  prefix_inspections:
    ./lib:
      - LD_LIBRARY_PATH
    ./lib64:
      - LD_LIBRARY_PATH
  default:
    arch_folder: false
    roots:
      lmod: /opt/software/modules/lmod

    lmod:
      hash_length: 0
      # Do not generate modules for implicit dependencies
      exclude_implicits: true

      hierarchy:
        - mpi

      all:
        environment:
          # Add the `<LIBNAME>_ROOT` variable pointing to the library root path
          set:
            "{name}_ROOT": "{prefix}"
        suffixes:
          +mpi: mpi
          +openmp: openmp

      core_specs:
        - cmake

      exclude:
        - '%gcc@7.5.0'
        - lmod
