stages:
  - build
  - test
  - code-quality

# Include Ruff component for linting and formatting Python code
# https://gitlab.com/swepy/cicd-templates/ruff
include:
  - component: $CI_SERVER_FQDN/swepy/cicd-templates/ruff/code-quality-report@8.0.0
    inputs:
      stage: code-quality
      image: ghcr.io/astral-sh/ruff:0.15.12-alpine3.23
      # Redefine the options to remove the --preview that activates unstable rules.
      format-options-base: --check

code-quality-report:lint:ruff:format:
  needs: []
  artifacts:
    when: always
    expire_in: 1 week

    paths:
      - code-quality-report-ruff-format.json

code-quality-report:lint:ruff:check:
  needs: []
  allow_failure: true

.spec-image-gcc-13.3.0:
  image:
    name: elanti/spectre-ci-container-gcc-13.3.0:latest
    entrypoint: [""]
  before_script:
    - source /etc/profile


# Building the code with GNU compiler 13.3.0 and default options, i.e. Release
build-gnu-13.3.0:
  extends: .spec-image-gcc-13.3.0
  stage: build
  script:
    - echo "Building the code with GNU compiler 13.3.0 in Release mode"
    - python -m venv --system-site-packages venv
    - source venv/bin/activate
    - python -m pip install . -v
  artifacts:
    paths:
      - venv
    expire_in: 1 week

# Testing the code with GNU compiler 13.3.0 and default options, i.e. Release
test-gnu-13.3.0:
  extends: .spec-image-gcc-13.3.0
  stage: test
  needs:
    - build-gnu-13.3.0
  script:
    - echo "Testing the code with GNU compiler 13.3.0"
    - source venv/bin/activate
    - python -m pytest --verbose --junitxml=pytest-report.xml tests
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    expire_in: 1 month
