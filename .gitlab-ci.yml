stages:
  - build
  - test
  - documentation
  - code-quality

# Include Ruff component for linting and formatting Python code
# https://gitlab.com/swepy/cicd-templates/ruff
include:
  - component: $CI_SERVER_FQDN/swepy/cicd-templates/ruff/code-quality-report@8.0.0
    inputs:
      stage: code-quality
      target-paths: "spectre scripts examples"
      allow-failure: true

code-quality-report:lint:ruff:format:
  needs: []

code-quality-report:lint:ruff:check:
  needs: []

.spec-image:
  image:
    name: elanti/spec-ci-container
    entrypoint: [""]
  before_script:
    - source /etc/profile


# Building the code
build-gnu:
  extends: .spec-image
  stage: build
  script:
    - echo "Building the code with GNU compiler..."
    - ml gcc/13.2.0 openblas/0.3.24 openmpi/4.1.6 python/3.11.6 cmake/3.27.7 py-numpy/1.26.1 fftw/3.3.10-mpi hdf5/1.14.3-mpi py-mpi4py/3.1.4
    - pip install -e . -v

# Testing the code
