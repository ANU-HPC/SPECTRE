stages:
  - build
  - test
  - documentation
  - code-quality

# Include Ruff component for linting and formatting Python code
# https://gitlab.com/swepy/cicd-templates/ruff
include:
  - component: $CI_SERVER_FQDN/swepy/cicd-templates/ruff/code-quality-report@8.0.0
    inputs:
      stage: code-quality
      target-paths: "spectre scripts examples"
      allow-failure: true

code-quality-report:lint:ruff:format:
  needs: []

code-quality-report:lint:ruff:check:
  needs: []

.spec-image:
  image:
    name: elanti/spec-ci-container
    entrypoint: [""]
  before_script:
    - source /etc/profile


# # Building the code
# build-gnu:
#   extends: .spec-image
#   stage: build
#   script:
#     - echo "Building the code with GNU compiler..."
#     - ml av

# Generating the documentation
build-and-deploy-documentation:
  needs: []
  image: python:3.10-slim
  stage: documentation
  before_script:
    - pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints sphinx-autoapi sphinxcontrib-bibtex
  script:
    - cd docs/source
    - sphinx-build -b html . ../../public
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

