[build-system]
    requires = [
        "scikit-build-core",
        "numpy",
        "f90wrap<0.3",
        ]
    build-backend = "scikit_build_core.build"

[project]
    name = "spectre"
    version = "0.1.0"
    dependencies = [
        "numpy",
        "f90wrap<0.3",
        "f90nml",
        "tomlkit",
        "scipy",
        "numba",
        "pytest",
        "threadpoolctl",
        "mpi4py",
        "h5py",
        "matplotlib",
        # Pinned git install: the PyPI CyRK artifacts (<= 0.17.1) still carry a
        # stale CC-BY-NC-SA license string; this commit is Apache-2.0 throughout.
        "CyRK @ git+https://github.com/jrenaud90/CyRK.git@64bc40e86d12c161c6f1c3e04075b12d187a7f58",
        "pydantic",
        ]
    license = { file = "LICENSE" }

[tool.scikit-build]
    ninja.version = ">=1.10"
    cmake.version = ">=3.20"
    wheel.packages = ["spectre"]
    build-dir = "build/"
    wheel.license-files = ["LICEN[CS]E*", "COPYING*", "NOTICE*", "AUTHORS*", "thirdparty_licenses/*"]

[tool.scikit-build.cmake.define]
    CMAKE_POSITION_INDEPENDENT_CODE = "ON"
    CMAKE_BUILD_TYPE="Release"
    #CMAKE_BUILD_TYPE="Debug"
    USE_OPENMP = "ON"
    # FFT backend: pocketfft (default), fftw, or mkl. Override with
    #   pip install -e . -C cmake.define.SPECTRE_FFT_BACKEND=fftw
    SPECTRE_FFT_BACKEND = "pocketfft"

[project.optional-dependencies]
    docs = [
        "sphinx",
        "sphinx-rtd-theme",
        "sphinx-autodoc-typehints",
        "sphinx-autoapi",
        "sphinxcontrib-bibtex",
        "myst-parser",
        "myst-nb",
    ]
    dev = [
        "ruff==0.15.12",
        "pytest",
    ]

# The following activates various Ruff checks for respectively:
# Style, correctness, modernization, simplification, and import-sorting rules.
[tool.ruff.lint]
    select = [
        "E",
        "D",
        "D401",
        "F",
        "UP",
        "B",
        "SIM",
        "I",
    ]

# Tests are not docstring-linted: silence the pydocstyle (D*) rules under tests/.
[tool.ruff.lint.per-file-ignores]
    "tests/**" = ["D"]

[tool.ruff]
    required-version = "==0.15.12"
    include = ["spectre/**/*.py", "scripts/**/*.py", "examples/**/*.py", "tests/**/*.py"]
    line-length = 100
    indent-width = 4

[tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    docstring-code-format = true

[tool.ruff.lint.pydocstyle]
    convention = "google"

[tool.pytest.ini_options]
    filterwarnings = [
        "ignore::DeprecationWarning",
    ]
    markers = [
        "map2disc: marks tests that use map2disc",
        "simsopt: marks tests that use simsopt",
        "integration: marks integration tests that use external codes, such as map2disc or simsopt; applied automatically to all map2disc/simsopt tests (deselect with -m 'not integration')",
    ]
