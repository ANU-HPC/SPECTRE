[build-system]
    requires = [
        "scikit-build-core",
        "numpy",
        "f90wrap<0.3",
        ]
    build-backend = "scikit_build_core.build"

[project]
    name = "spectre"
    version = "0.1.0"
    dependencies = [
        "numpy",
        "f90wrap<0.3",
        "f90nml",
        "tomlkit",
        "scipy",
        "numba",
        "pytest",
        "threadpoolctl",
        "mpi4py",
        "h5py",
        "matplotlib",
        "CyRK",
        "pydantic",
        ]
    # A default install uses the fastest backends regardless of license: FFTW
    # (GPL) for the FFT and CyRK (CC-BY-NC-SA, NonCommercial) for the field-line
    # tracer. For commercial use, build with the SPECTRE_COMMERCIAL_USE
    # environment variable set (see [[tool.scikit-build.overrides]] below): the
    # FFT backend switches to pocketfft (BSD-3) and the tracer defaults to the
    # permissive scipy integrator (additionally `pip uninstall CyRK` if the
    # NonCommercial package must not be present at all).
    license = { file = "LICENSE" }

[tool.scikit-build]
    ninja.version = ">=1.10"
    cmake.version = ">=3.20"
    wheel.packages = ["spectre"]
    build-dir = "build/"

[tool.scikit-build.cmake.define]
    CMAKE_POSITION_INDEPENDENT_CODE = "ON"
    CMAKE_BUILD_TYPE="Release"
    #CMAKE_BUILD_TYPE="Debug"
    USE_OPENMP = "ON"
    # FFT backend: fftw (default), mkl, or pocketfft (default when
    # SPECTRE_COMMERCIAL_USE is set; see the override below). Empty = let CMake
    # resolve the default. Both defines are always passed so that a shared build
    # directory never keeps a stale choice cached. Pick a backend explicitly with:
    #   pip install -e . -C cmake.define.SPECTRE_FFT_BACKEND=mkl
    SPECTRE_FFT_BACKEND = ""
    SPECTRE_COMMERCIAL_USE = "OFF"

# Commercial-use builds: `SPECTRE_COMMERCIAL_USE=1 pip install .` selects the
# permissively-licensed backends (pocketfft FFT instead of GPL FFTW, and the
# field-line tracer defaults to scipy instead of the NonCommercial CyRK).
# inherit..."append" merges this define into the table above instead of
# replacing it.
[[tool.scikit-build.overrides]]
    if.env.SPECTRE_COMMERCIAL_USE = true
    inherit.cmake.define = "append"
    cmake.define.SPECTRE_COMMERCIAL_USE = "ON"

[project.optional-dependencies]
    docs = [
        "sphinx",
        "sphinx-rtd-theme",
        "sphinx-autodoc-typehints",
        "sphinx-autoapi",
        "sphinxcontrib-bibtex",
        "myst-parser",
        "myst-nb",
    ]
    dev = [
        "ruff==0.15.12",
        "pytest",
    ]

# The following activates various Ruff checks for respectively:
# Style, correctness, modernization, simplification, and import-sorting rules.
[tool.ruff.lint]
    select = [
        "E",
        "D",
        "D401",
        "F",
        "UP",
        "B",
        "SIM",
        "I",
    ]

# Tests are not docstring-linted: silence the pydocstyle (D*) rules under tests/.
[tool.ruff.lint.per-file-ignores]
    "tests/**" = ["D"]

[tool.ruff]
    required-version = "==0.15.12"
    include = ["spectre/**/*.py", "scripts/**/*.py", "examples/**/*.py", "tests/**/*.py"]
    line-length = 100
    indent-width = 4

[tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    docstring-code-format = true

[tool.ruff.lint.pydocstyle]
    convention = "google"

[tool.pytest.ini_options]
    filterwarnings = [
        "ignore::DeprecationWarning",
    ]
    markers = [
        "map2disc: marks tests that use map2disc",
        "simsopt: marks tests that use simsopt",
        "integration: marks integration tests that use external codes, such as map2disc or simsopt; applied automatically to all map2disc/simsopt tests (deselect with -m 'not integration')",
    ]
