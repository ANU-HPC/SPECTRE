[build-system]
    requires = [
        "scikit-build-core",
        "numpy",
        "f90wrap<0.3",
        ]
    build-backend = "scikit_build_core.build"

[project]
    name = "spectre"
    version = "0.1.0"
    dependencies = [
        "numpy",
        "f90wrap<0.3",
        "f90nml",
        "tomlkit",
        "scipy",
        "numba",
        "pytest",
        "threadpoolctl",
        "mpi4py",
        "h5py",
        "matplotlib",
        "pydantic",
        ]
    # Base dependencies are all permissive (MIT/BSD): a plain `pip install spectre`
    # installs no GPL or NonCommercial software. The faster CyRK ODE backend is an
    # opt-in extra (see [project.optional-dependencies] non-commercial); the FFT
    # backend is chosen at build time via SPECTRE_FFT_BACKEND (default pocketfft).
    license = { file = "LICENSE" }

[tool.scikit-build]
    ninja.version = ">=1.10"
    cmake.version = ">=3.20"
    wheel.packages = ["spectre"]
    build-dir = "build/"

[tool.scikit-build.cmake.define]
    CMAKE_POSITION_INDEPENDENT_CODE = "ON"
    CMAKE_BUILD_TYPE="Release"
    #CMAKE_BUILD_TYPE="Debug"
    USE_OPENMP = "ON"
    # FFT backend. Default is pocketfft (BSD-3, fetched at configure time): a plain
    # build is fully MIT-redistributable. Opt in to fftw (GPL; fine for non-commercial
    # use) or mkl (Intel MKL FFTW3 interface; proprietary but redistributable, fast).
    # Override per-build, e.g.:
    #   pip install -e . -C cmake.define.SPECTRE_FFT_BACKEND=fftw
    SPECTRE_FFT_BACKEND = "pocketfft"

[project.optional-dependencies]
    docs = [
        "sphinx",
        "sphinx-rtd-theme",
        "sphinx-autodoc-typehints",
        "sphinx-autoapi",
        "sphinxcontrib-bibtex",
        "myst-parser",
        "myst-nb",
    ]
    dev = [
        "ruff==0.15.12",
        "pytest",
    ]
    # Opt-in: adds the faster CyRK field-line ODE backend. CyRK is CC-BY-NC-SA
    # (NonCommercial), so it is NOT a base dependency; installing this extra makes
    # rk_backend default to "cyrk". Omit it for a fully-permissive install (the
    # tracer then defaults to the permissive scipy backend).
    #   pip install spectre[non-commercial]
    non-commercial = ["CyRK"]

# The following activates various Ruff checks for respectively:
# Style, correctness, modernization, simplification, and import-sorting rules.
[tool.ruff.lint]
    select = [
        "E",
        "D",
        "D401",
        "F",
        "UP",
        "B",
        "SIM",
        "I",
    ]

[tool.ruff]
    required-version = "==0.15.12"
    include = ["spectre/**/*.py", "scripts/**/*.py", "examples/**/*.py", "tests/**/*.py"]
    line-length = 100
    indent-width = 4

[tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    docstring-code-format = true

[tool.ruff.lint.pydocstyle]
    convention = "google"

[tool.pytest.ini_options]
    filterwarnings = [
        "ignore::DeprecationWarning",
    ]
    markers = [
        "map2disc: marks tests that use map2disc",
        "simsopt: marks tests that use simsopt",
        "integration: marks integration tests that use external codes, such as map2disc or simsopt; applied automatically to all map2disc/simsopt tests (deselect with -m 'not integration')",
    ]
